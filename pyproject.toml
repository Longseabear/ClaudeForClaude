[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudeforclaude"
version = "0.1.0"
description = "Privacy-preserving workspace helper for Claude Code transcripts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Longseabear" }]
dependencies = []

[project.scripts]
clfc = "clfc.cli.main:main"

[tool.setuptools.packages.find]
include = ["clfc*"]
